    <path d="M30,50 Q40,35 50,50" fill="#e55322"/>
    <rect x="35" y="10" width="10" height="10" fill="#cc0000"/>
    
    <!-- Testo "Pizza" -->
    <text x="80" y="48" font-family="Georgia, serif" font-size="42" font-weight="bold" fill="#ffffff">Pizza</text>
    
    <!-- Testo "di Casa" -->
    <text x="195" y="48" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="300" fill="#cc0000">di Casa</text>
    
    <!-- Linea tricolore minimalista -->
